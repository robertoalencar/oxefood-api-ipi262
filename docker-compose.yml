services:

 db:
   image: postgres:15-alpine
   container_name: postgres_container_ipi262
   restart: always
   environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: oxefood
     POSTGRES_DB: oxefood-db
   ports:
     - "5441:5432"
   volumes:
     - ./postgres-data:/bitnami/postgresql/data
